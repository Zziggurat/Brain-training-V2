<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Brain Training: entrena multiplicaciones y divisiones con aprendizaje adaptativo, repaso espaciado y estadísticas de progreso." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#05070d" />
  <title>Brain training</title>
  <!-- Manifest y configuración para PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-title" content="Brain training" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <!-- Precarga del fondo para que aparezca sin destello sobre el color base -->
  <link rel="preload" as="image" href="assets/ciudad-cyberpunk.png" />
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* CSS crítico mínimo: evita destello sin estilo mientras carga style.css */
    :root {
      color-scheme: dark;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #05070d;
    }
  </style>
  <link rel="stylesheet" href="style.css?r=20260713-4" />
  <link rel="stylesheet" href="custom.css?r=20260713-4" />
  <script defer src="lib/problemWeight.js?r=20260713-4"></script>
  <script defer src="lib/adaptiveEngine.js?r=20260713-4"></script>
  <script defer src="lib/levels.js?r=20260713-4"></script>
  <script defer src="script.js?r=20260713-4"></script>
</head>

<body>
  <div id="root">
    <div class="scroll">
      <!-- Pantalla de inicio -->
      <div id="home-screen" class="screen active">
        <div class="home-top-bar">
          <button id="home-settings-btn" class="round-icon-btn settings-btn" aria-label="Abrir configuración">
            ⚙
          </button>
          <button id="home-progress-shortcut" class="round-icon-btn" aria-label="Ver progreso general">
            🏆
          </button>
        </div>
        <!-- Contenedor principal del home -->
        <div class="home-container">
          <!-- Tarjeta principal de la pantalla de inicio -->
          <div class="home-card">
            <h1 id="home-title">Brain training</h1>
            <!-- Controles para elegir el modo de operación -->
            <div id="home-operation-toggle" class="operation-toggle" role="group" aria-label="Modo de operación">
              <button id="home-op-mul" class="op-btn active" aria-pressed="true">A × B = ?</button>
              <button id="home-op-div" class="op-btn" aria-pressed="false">A ÷ B = ?</button>
            </div>
            <!-- Barra de progreso dentro de la tarjeta -->
            <div id="progress-wrapper" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
              aria-label="Progreso de aprendizaje">
              <div id="progress-bar">
                <div id="progress-fill"></div>
              </div>
              <span id="progress-text">0%</span>
            </div>
            <p class="progress-label">Tu progreso de aprendizaje</p>
          </div>
          <!-- Contenedor inferior con botones y asistente -->
          <div class="home-bottom-row">
            <!-- Botones de navegación principales -->
            <div class="home-buttons">
              <button id="home-learn-btn">Aprendizaje</button>
              <button id="home-train-btn">Entrenamiento</button>
              <button id="home-levels-btn">Niveles</button>
              <button id="home-errors-btn">Errores de hoy <span id="errors-badge" class="errors-badge hidden"
                  aria-hidden="true"></span></button>
              <button id="home-tables-btn">Tablas</button>
              <button id="home-progress-btn">Progreso</button>
            </div>
            <!-- Panel de asistente con recomendaciones -->
            <div id="assistant-panel" class="assistant-panel"></div>
          </div>
          <div class="home-bottom-actions">
            <button id="help-btn" class="round-icon-btn" type="button" aria-label="Ayuda">❓</button>
            <button id="tips-btn" class="round-icon-btn" type="button" aria-label="Consejos">💡</button>
          </div>
        </div>
      </div>

      <!-- Pantalla de configuración -->
      <div id="config-screen" class="screen">
        <div class="config-header">
          <button id="config-back-btn" class="back-home-btn" aria-label="Volver al inicio">←</button>
          <h2>Configuración</h2>
        </div>
        <div class="config-body">
          <!-- Operación -->
          <div class="config-section">
            <label>Modo</label>
            <div class="mode-options">
              <label><input type="radio" name="operation" value="multiplication"> A × B = ?</label>
              <label><input type="radio" name="operation" value="division"> A ÷ B = ?</label>
            </div>
          </div>
          <!-- Intervalo de cifras -->
          <div class="config-section">
            <label id="interval-label">Intervalo de cifras</label>
            <div class="interval-inputs">
              <input type="number" id="config-min" min="1" max="50" inputmode="numeric" value="1"
                aria-label="Cifra mínima">
              <span aria-hidden="true">a</span>
              <input type="number" id="config-max" min="1" max="50" inputmode="numeric" value="10"
                aria-label="Cifra máxima">
            </div>
          </div>
          <!-- Múltiples opciones -->
          <div class="config-section">
            <label for="config-multiple-choice">Múltiples opciones</label>
            <div class="checkbox-row">
              <input type="checkbox" id="config-multiple-choice">
              <label for="config-multiple-choice" class="checkbox-label">Mostrar cuatro opciones de respuesta</label>
            </div>
          </div>
          <!-- Número de problemas -->
          <div class="config-section">
            <label for="config-num-questions">Número de problemas por sesión</label>
            <select id="config-num-questions">
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="30">30</option>
              <option value="50">50</option>
            </select>
          </div>
          <!-- Tiempo por problema -->
          <div class="config-section">
            <label for="config-seconds">Tiempo por problema (segundos)</label>
            <input type="number" id="config-seconds" min="1" max="600" inputmode="numeric" value="30">
          </div>
        </div>
        <div class="config-footer">
          <button id="config-save-btn">Guardar</button>
          <button id="reset-progress-btn" class="reset-btn">Eliminar progreso</button>
        </div>
      </div>

      <!-- Pantalla de aprendizaje -->
      <div id="learning-screen" class="screen">
        <div class="top-bar">
          <button class="back-home-btn" id="learn-back-btn" aria-label="Volver al inicio">←</button>
          <span id="learn-progress" class="progress-text"></span>
        </div>
        <!-- Card para el problema y sus estrellas -->
        <div class="problem-card">
          <div class="card-front">
            <div id="learn-stars" class="stars"></div>
            <div id="learn-problem" class="problem"></div>
          </div>
        </div>
        <div id="learn-answer-area" class="answer-area"></div>
        <div id="learn-feedback" class="feedback" role="status" aria-live="polite"></div>
        <button id="learn-skip-btn">Mostrar respuesta</button>
      </div>

      <!-- Pantalla de entrenamiento -->
      <div id="training-screen" class="screen">
        <div class="top-bar">
          <button class="back-home-btn" id="train-back-btn" aria-label="Volver al inicio">←</button>
          <span id="train-progress" class="progress-text"></span>
          <div id="train-timer-bar" aria-hidden="true">
            <div id="train-timer-fill"></div>
          </div>
        </div>
        <!-- Card para el problema (sin estrellas en entrenamiento) -->
        <div class="problem-card">
          <div class="card-front">
            <div id="train-problem" class="problem"></div>
          </div>
        </div>
        <div id="train-answer-area" class="answer-area"></div>
        <div id="train-feedback" class="feedback" role="status" aria-live="polite"></div>
        <div id="train-score" class="score" role="status"></div>
        <button id="train-skip-btn">Mostrar respuesta</button>
        <button id="train-restart-btn" class="hidden">Reintentar</button>
      </div>

      <!-- Pantalla de niveles de cálculo mental -->
      <div id="levels-screen" class="screen">
        <div class="top-bar">
          <button class="back-home-btn" id="levels-back-btn" aria-label="Volver al inicio">←</button>
          <h2>Niveles</h2>
        </div>
        <div id="levels-map" class="levels-map"></div>
      </div>

      <!-- Pantalla de tablas -->
      <div id="tables-screen" class="screen">
        <div class="top-bar">
          <button class="back-home-btn" id="tables-back-btn" aria-label="Volver al inicio">←</button>
          <h2>Tablas</h2>
        </div>
        <!-- Barra para habilitar entrenamiento específico -->
        <div id="specific-training-bar" class="specific-training-bar">
          <label for="specific-toggle" class="specific-label">Entrenamiento específico</label>
          <input type="checkbox" id="specific-toggle">
          <button id="start-specific-btn" class="hidden">Empezar entrenamiento específico</button>
        </div>
        <div id="tables-container" class="tables-container"></div>
      </div>

      <!-- Pantalla de progreso -->
      <div id="progress-screen" class="screen">
        <div class="progress-top-bar">
          <button id="progress-back-btn" aria-label="Volver al inicio">←</button>
          <h2>Progreso</h2>
        </div>
        <div id="heatmap-container">
          <!-- El mapa de calor se generará dinámicamente aquí -->
        </div>
        <!-- Tarjeta para mostrar el resultado de la celda seleccionada en el mapa de calor -->
        <div id="result-card" class="result-card" aria-live="polite"></div>
        <!-- Métricas del día y meta diaria -->
        <div class="progress-extras">
          <div id="metrics-card" class="metrics-card"></div>
          <div id="goal-card" class="goal-card"></div>
        </div>
        <!-- Análisis del motor adaptativo: tendencia, fortalezas y debilidades -->
        <div id="analysis-card" class="analysis-card" aria-live="polite"></div>
      </div>

      <footer class="version-tag" aria-label="Marcador de versión">Brain Training · v2.1</footer>
    </div>
  </div>

  <!-- Ventana modal para ayuda y consejos -->
  <div id="app-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <h3 id="modal-title"></h3>
      <ul id="modal-body"></ul>
      <button id="modal-close-btn">Entendido</button>
    </div>
  </div>

  <!-- Contenedor de notificaciones tipo toast -->
  <div id="toast-container" aria-live="polite"></div>
</body>

</html>
